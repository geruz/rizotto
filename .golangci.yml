version: "2"

linters:
    default: all
    disable:
        - gomodguard
        - wsl
        - depguard
        - wrapcheck
        - varnamelen
        - revive
        - wsl_v5
        - testpackage
        - recvcheck
        - ireturn
        - gochecknoglobals
        - gochecknoinits
        - exhaustruct
    enable:
        - gomodguard_v2
        - exhaustruct_v5

    # settings:
    #     tagliatelle:
    #         case:
    #             rules:
    #                 json: snake

formatters:
    enable:
        - gofmt
        - goimports
